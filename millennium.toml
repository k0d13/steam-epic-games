# Files read at runtime through millennium.assets, under these same paths.
assets = [["backend/jobs/scripts/*"]]

[plugin]
id = "epic-games"
name = "Epic Games"
version = "0.7.1"
author = "k0d13"
description = "Browse, install and launch your Epic Games library from Steam."

[backend]
entry = "backend/main.lua"
sources = ["backend/**/*.lua"]

[frontend]
entry = "frontend/index.tsx"

[webkit]
entry = "webview/index.ts"

[compiler]
output_path = "auto"

[dev]
auto_restart = true
reload_steamui_when = "both"
