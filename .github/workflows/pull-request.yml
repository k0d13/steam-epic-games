name: Pull Request

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "millennium.toml"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - "knip.json"
      - "frontend/**"
      - "webview/**"
      - "backend/**"
      - "scripts/**"
      - ".changeset/**"
      # All of them, or a pull request touching only an unused one leaves required checks pending
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "mise.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml
