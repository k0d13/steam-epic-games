name: Quality

on:
  workflow_call:

# Not the repository default, as these jobs run branch code and a token that can push
# to main can reach the release pipeline
permissions:
  contents: read

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup toolchain
        uses: ./.github/actions/toolchain

      - name: Build plugin
        run: mise run build

      # Released as is, so what ships is what passed
      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: .millennium/*.star
          retention-days: 1
          include-hidden-files: true

  check:
    name: Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup toolchain
        uses: ./.github/actions/toolchain

      - name: Type check the frontend, webview and backend
        run: mise run check:types

  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup toolchain
        uses: ./.github/actions/toolchain

      - name: Lint the frontend and backend
        run: mise run check:lint

      - name: Check React
        run: mise run check:react

      - name: Check formatting
        run: mise run check:format
