name: Release

# A manual dispatch only runs the gate, as releases come from what lands on main
on:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "millennium.toml"
      - "tsconfig.json"
      - ".oxfmtrc.json"
      - "frontend/**"
      - "webview/**"
      - "backend/**"
      - "scripts/**"
      - ".changeset/**"
      - ".github/workflows/release.yml"
      - ".github/workflows/quality.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "mise.toml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling could stop a release part way through
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  process:
    name: Processing Changesets
    needs: [quality]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup toolchain
        uses: ./.github/actions/toolchain

      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: .millennium/

      - name: Process changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          version-script: bash .github/scripts/release-version.sh
          publish-script: bash .github/scripts/release-publish.sh
          pr-title: "Pending Releases"
          commit-message: "Update changelog and release"
          # The publish script makes the release and tag, and the action's own would 409
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLUGIN_DB_TOKEN: ${{ secrets.PLUGIN_DB_TOKEN }}
          # Only for a rename since this was added to PluginDatabase
          PLUGIN_DB_SUBMODULE_PATH: ${{ vars.PLUGIN_DB_SUBMODULE_PATH }}

  snapshot:
    name: Releasing Snapshot
    needs: [process]
    runs-on: ubuntu-latest
    # A beta of changesets still pending, when there was no version PR to publish
    if: ${{ needs.process.outputs.published == 'false' }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup toolchain
        uses: ./.github/actions/toolchain

      - name: Publish snapshot release
        run: bash .github/scripts/release-snapshot.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
